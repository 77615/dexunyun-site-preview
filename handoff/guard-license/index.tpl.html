<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>卫士授权标注原型</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--t1:#1d2129;--t2:#4e5969;--t3:#86909c;--line:#e5e6eb;--pri:#165dff;--add:#00b42a;--mod:#165dff;--del:#f53f3f;--q:#ff7d00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#232324;--t1:rgba(255,255,255,.9);--t2:rgba(255,255,255,.7);--t3:rgba(255,255,255,.5);--line:#333335}}
:root[data-theme="dark"]{--bg:#17171a;--card:#232324;--t1:rgba(255,255,255,.9);--t2:rgba(255,255,255,.7);--t3:rgba(255,255,255,.5);--line:#333335}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:1120px;margin:0 auto;padding:40px 16px 64px}h1{font-size:24px;margin:0 0 8px}p{color:var(--t2);margin:0 0 8px}
.lg{display:flex;flex-wrap:wrap;gap:16px;margin:16px 0 24px;color:var(--t2);font-size:13px}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.docs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}.docs a{padding:6px 14px;border:1px solid var(--line);background:var(--card);color:var(--t1);text-decoration:none;border-radius:4px}.docs a:hover{border-color:var(--pri);color:var(--pri)}
h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;color:inherit;text-decoration:none}.card:hover{border-color:var(--pri)}
.card b{display:block;font-weight:500}.card small{color:var(--t3)}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.chip{font-size:12px;line-height:20px;padding:0 6px;border-radius:10px;color:#fff}.add{background:var(--add)}.mod{background:var(--mod)}.del{background:var(--del)}.q{background:var(--q)}
</style></head><body><main>
<h1>德迅安全卫士授权调整 · 标注版原型</h1>
<p>2026-11-23 画布快照，共 {{N_PAGES}} 个页面、{{N_MARKS}} 个改动点。打开页面后，圆形编号就是改动点编号（C01 起），点开看改了什么、依据哪条规则、对应哪个开发任务；右侧工具栏的文档按钮里有完整的变更说明和任务清单。</p>
<div class="lg"><span><i style="background:var(--add)"></i>新增</span><span><i style="background:var(--mod)"></i>修改</span><span><i style="background:var(--del)"></i>删除</span><span><i style="background:var(--q)"></i>待确认</span></div>
<div class="docs"><a href="https://github.com/77615/dexunyun-site-preview/blob/main/handoff/guard-license/docs/01-变更说明.md">01 变更说明</a><a href="https://github.com/77615/dexunyun-site-preview/blob/main/handoff/guard-license/docs/02-开发任务清单.md">02 开发任务清单</a></div>
<h2>页面</h2><div class="grid">
{{CARDS}}
</div></main></body></html>
