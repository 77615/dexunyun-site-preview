<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>德迅卫士 新旧菜单对照</title>
<script src="./support.js"></script>

<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#f5f7fb}
.kc-map{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;color:#1d2129}
.kc-map *{box-sizing:border-box}
.kc-mt{width:100%;border-collapse:collapse;font-size:13px}
.kc-mt th{background:#f7f8fa;color:#4e5969;font-weight:600;text-align:left;height:38px;padding:0 14px;white-space:nowrap}
.kc-mt td{height:31px;padding:0 14px;border-top:1px solid #f0f2f5}
.kc-mt td.g{color:#6b7785;font-size:12px}
.kc-mt td.n{color:#165dff;font-weight:600}
.kc-pill{display:inline-flex;height:22px;align-items:center;padding:0 8px;border-radius:4px;font-size:12px;border:1px solid}
.kc-pill.keep{background:#e8f9f0;border-color:#b9ebd0;color:#00754e}
.kc-pill.tab{background:#eaf2ff;border-color:#b5d0ff;color:#165dff}
.kc-pill.ren{background:#fff4e8;border-color:#ffd9a3;color:#a84700}
.kc-pill.ask{background:#f6f9ff;border-color:#b5d0ff;color:#0e4edb}
.kc-tree-g{font-size:12px;color:#6b7785;margin:14px 0 6px}
.kc-tree-i{height:34px;display:flex;align-items:center;padding:0 10px;border-radius:4px;color:#4e5969}
.kc-tree-i span{margin-left:auto;font-size:12px;color:#6b7785}
.kc-pill.new{background:#fff0f0;border-color:#ffc4c4;color:#cb2634}
.kc-tree-i.new{color:#cb2634;background:#fff7f7}




/* side54：侧栏统一 */
.kc-side{flex:0 0 220px;display:flex;flex-direction:column;padding:12px 10px 0;border-right:1px solid #e5e9f0;background:radial-gradient(70% 16% at 90% 70%,rgba(186,215,246,.75),rgba(186,215,246,0) 70%),radial-gradient(80% 18% at 10% 74%,rgba(210,232,250,.7),rgba(210,232,250,0) 70%),linear-gradient(180deg,#fbfcfe 0%,#f5f7fb 42%,#edf3fb 72%,#f2f5fa 100%)}
.kc-side .kc-sh{padding:6px 10px 14px;margin:0 0 4px;border-bottom:1px solid rgba(229,233,240,.9)}
.kc-side .kc-gl{display:flex;align-items:center;gap:6px;padding:16px 8px 6px;font-size:12px;color:#86909c;font-weight:400}
.kc-side .kc-gl svg{flex:0 0 auto;color:#86909c}
.kc-side .kc-gl + .kc-it{margin-top:2px}
.kc-side .kc-it{position:relative;display:flex;align-items:center;gap:10px;height:40px;margin:2px 0;padding:0 10px;border-radius:6px;font-size:14px;color:#1d2129;font-weight:400;text-decoration:none;background:transparent}
.kc-side .kc-it:hover{background:rgba(255,255,255,.75)}
.kc-side .kc-it.on{background:#e1ecfd;color:#165dff;font-weight:500}
.kc-side .kc-it.on::after,.kc-side .kc-ki.on::after{content:"";position:absolute;right:-11px;top:6px;bottom:6px;width:3px;border-radius:2px;background:#165dff}
.kc-side .kc-it.cur{color:#165dff;font-weight:500}
.kc-side .kc-it span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc-side .kc-it em,.kc-side .kc-ki em{margin-left:auto;font-style:normal;font-size:12px;color:#86909c}
.kc-ic{flex:0 0 18px;width:18px;height:18px;background:#6b7785;-webkit-mask:var(--m) center/18px 18px no-repeat;mask:var(--m) center/18px 18px no-repeat}
.kc-it.on .kc-ic,.kc-it.cur .kc-ic{background:#165dff}
.kc-chev{flex:0 0 12px;width:12px;height:12px;margin-left:auto;background:#86909c;-webkit-mask:var(--chev) center/12px no-repeat;mask:var(--chev) center/12px no-repeat;transition:transform .15s}
.kc-chev.up{transform:rotate(90deg)}
.kc-it em + .kc-chev{margin-left:6px}
.kc-sub2{position:relative;margin:2px 0 6px 19px;padding-left:12px;border-left:1px solid #dfe5ee}
.kc-ki{position:relative;display:flex;align-items:center;height:36px;margin:2px 0;padding:0 12px;border-radius:6px;font-size:14px;color:#4e5969;text-decoration:none}
.kc-ki:hover{background:rgba(255,255,255,.75);color:#1d2129}
.kc-ki.on{background:#e1ecfd;color:#165dff;font-weight:500}
.kc-ki.on::after{right:-11px}
.kc-sf{margin:auto -10px 0;padding:10px 10px 14px;border-top:1px solid rgba(229,233,240,.9);background:rgba(255,255,255,.45)}
.kc-sf .kc-it{color:#4e5969}
.kc-nv{padding-bottom:24px}
/* volc55：筛选栏 / 流量路径 / 模块标签 / 未开通引导 */
.kc-fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.kc-fbar .kc-range{height:32px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid #e5e6eb;border-radius:2px;background:#fff;font-size:13px;color:#4e5969}
.kc-fsp{flex:1}
.kc-ib{width:32px;height:32px;border:1px solid #e5e6eb;border-radius:2px;background:#fff;color:#4e5969;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.kc-ib:hover{color:#165dff;border-color:#bedaff}
.kc-flowc{margin-bottom:16px}
.kc-flow{display:flex;align-items:center;gap:0;padding:24px 40px 18px}
.kc-fn{display:flex;flex-direction:column;align-items:center;gap:8px;flex:0 0 auto;font-size:13px;color:#1d2129}
.kc-fn i{width:52px;height:52px;border-radius:12px;background:#f2f3f5;color:#4e5969;display:flex;align-items:center;justify-content:center}
.kc-fn b{font-weight:500}
.kc-fn.mid i{background:linear-gradient(135deg,#e8f3ff,#d6e8ff);color:#165dff;box-shadow:0 0 0 6px rgba(22,93,255,.06)}
.kc-fn.big i{width:96px;height:96px;border-radius:24px}
.kc-fn.big i svg{width:44px;height:44px}
.kc-fn.bad i{background:#ffece8;color:#f53f3f}
.kc-fl{flex:1;position:relative;height:60px;margin:0 16px 22px}
.kc-fl::before,.kc-fl::after{content:"";position:absolute;left:0;right:0;border-top:1.5px dashed #165dff}
.kc-fl::before{top:22px}
.kc-fl::after{top:38px;border-top-color:#14c9c9}
.kc-fl span{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;color:#4e5969;white-space:nowrap;background:#fff;padding:0 6px}
.kc-fl span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px;background:#165dff}
.kc-fl .t{top:0}
.kc-fl .b{top:44px}
.kc-fl .b::before{background:#14c9c9}
.kc-fl .t::after{content:"";position:absolute;right:-12px;top:7px;border:5px solid transparent;border-left-color:#165dff;display:none}
.kc-fo{display:flex;flex-direction:column;gap:6px;margin-left:20px;padding:10px 14px;background:#f7f8fa;border-radius:4px;font-size:12px;color:#4e5969}
.kc-fks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid #f2f3f5}
.kc-fk{display:block;padding:14px 20px;text-decoration:none;color:#1d2129;border-left:1px solid #f2f3f5}
.kc-fk:first-child{border-left:0}
.kc-fk:hover{background:#f7f8fa}
.kc-fk span{font-size:13px;color:#4e5969}
.kc-fk b{display:block;margin-top:4px;font-size:22px;font-weight:600}
.kc-fk b small{font-size:12px;font-weight:400;color:#86909c;margin-left:4px}
.kc-mtabs{margin:0 !important;align-items:center;padding-right:20px}
.kc-mtabs .kc-sg button{height:26px !important;padding:0 12px !important;border-bottom:0 !important;font-size:13px}
.kc-mtabs .kc-sg button.on{color:#165dff;background:#fff}
.kc-top5 li a{color:#1d2129;text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc-top5 li a:hover{color:#165dff;text-decoration:underline}
.kc-hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:center;gap:24px;padding:32px 36px;margin-bottom:16px;background:linear-gradient(110deg,#fff 40%,#eef5ff 100%)}
.kc-hero h2{margin:0 0 10px;font-size:24px;font-weight:600}
.kc-hero p{margin:0 0 20px;color:#4e5969;line-height:1.7;max-width:560px}
.kc-hb2{display:flex;gap:10px}
.kc-heroart{display:flex;justify-content:center}
.kc-st4{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;counter-reset:s}
.kc-st4 li{position:relative;padding:16px;background:#f7f8fa;border-radius:4px;display:flex;flex-direction:column;gap:6px}
.kc-st4 i{width:24px;height:24px;border-radius:50%;background:#165dff;color:#fff;font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center}
.kc-st4 span{font-size:13px;color:#4e5969;line-height:1.6}
.kc-arch{display:grid;grid-template-columns:auto minmax(0,1.2fr) auto minmax(0,.8fr) auto;align-items:center;gap:16px;padding:12px 24px;border:1px dashed #dfe5ee;border-radius:6px}
.kc-srcs{display:flex;flex-direction:column;gap:14px}
.kc-alines{display:flex;flex-direction:column;gap:30px}
.kc-alines span{position:relative;display:block;font-size:12px;color:#4e5969;padding-bottom:6px;border-bottom:2px solid #00b42a}
.kc-alines span.warn{border-color:#f7ba1e}
.kc-alines span.bad{border-color:#f53f3f}
.kc-alines.one{justify-content:center}
.kc-abox{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;background:#f7f8fa;border-radius:6px}
.kc-abox small{font-size:12px;color:#86909c}
