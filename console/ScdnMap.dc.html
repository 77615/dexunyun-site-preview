<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SCDN 新旧菜单对照</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dexun/tokens.css">
<link rel="stylesheet" href="ds/dexun/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&display=swap" data-r91>
<style>
.kc-map{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:#0c0d0e}
.kc-map *{box-sizing:border-box}
.kc-mt{width:100%;border-collapse:collapse;font-size:13px}
.kc-mt th{background:#f7f8fa;color:#42464e;font-weight:500;text-align:left;height:38px;padding:0 14px;white-space:nowrap}
.kc-mt td{height:31px;padding:0 14px;border-top:1px solid #f0f2f5}
.kc-mt td.g{color:#737a87;font-size:12px}
.kc-mt td.n{color:#1664ff;font-weight:500}
.kc-pill{display:inline-flex;height:22px;align-items:center;padding:0 8px;border-radius:4px;font-size:12px;border:1px solid}
.kc-pill.keep{background:#e8f9f0;border-color:#b9ebd0;color:#00754e}
.kc-pill.tab{background:#eaf2ff;border-color:#b5d0ff;color:#1664ff}
.kc-pill.ren{background:#fff4e8;border-color:#ffd9a3;color:#a84700}
.kc-pill.ask{background:#f6f9ff;border-color:#b5d0ff;color:#1759dd}
.kc-tree-g{font-size:12px;color:#737a87;margin:14px 0 6px}
.kc-tree-i{height:34px;display:flex;align-items:center;padding:0 10px;border-radius:4px;color:#42464e}
.kc-tree-i span{margin-left:auto;font-size:12px;color:#737a87}
</style>
</helmet>
<div class="kc-map" style="width: 1440px; height: 1240px; background: #f5f7fb; padding: 40px 48px; display: flex; gap: 24px; align-items: flex-start;">
  <section style="width: 300px; flex-shrink: 0; background: #fff; border: 1px solid #e4eaf0; border-radius: 8px; padding: 24px 20px;">
    <div style="font-size: 12px; color:#1664ff; font-weight: 600;">新菜单</div>
    <h2 style="margin: 4px 0 4px; font-size: 20px; font-weight: 500; color:#253247;">5 组 · 15 项</h2>
    <p style="margin: 0 0 6px; font-size: 13px; color:#42464e; line-height: 1.6;">原 9 组、26 个页面，加上 4 处隐藏页和批量操作。按「接入 → 配策略 → 看结果」排序，同类功能合成一页用标签切换。</p>
    <sc-for list="{{tree}}" as="g" hint-placeholder-count="5">
      <div class="kc-tree-g">{{g.label}}</div>
      <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
        <div class="kc-tree-i">{{it.t}}<span>{{it.n}}</span></div>
      </sc-for>
    </sc-for>
    <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid #f0f2f5; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color:#42464e;">
      <div><span class="kc-pill keep">保留</span> 原页面整页保留，可能改名</div>
      <div><span class="kc-pill tab">并入标签</span> 成为某页里的一个标签</div>
      <div><span class="kc-pill ren">移位</span> 挪到别的入口里</div>
      <div><span class="kc-pill ask">已核对</span> 打开 5187 页面看过实际配置后归位</div>
    </div>
  </section>
  <section style="flex: 1; min-width: 0; background: #fff; border: 1px solid #e4eaf0; border-radius: 8px; overflow: hidden;">
    <div style="padding: 20px 24px 14px;">
      <h2 style="margin: 0; font-size: 18px; font-weight: 600;">新旧菜单对照</h2>
      <p style="margin: 4px 0 0; font-size: 13px; color:#42464e;">左边是 5187 原型里现有的 SCDN 菜单，右边是新位置。没有删除任何功能。</p>
    </div>
    <table class="kc-mt">
      <thead><tr><th>原分组</th><th>原菜单</th><th>新位置</th><th>处理</th><th>说明</th></tr></thead>
      <tbody>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="30">
          <tr>
            <td class="g">{{r.g}}</td>
            <td>{{r.o}}</td>
            <td class="n">{{r.n}}</td>
            <td><span class="{{r.pc}}">{{r.p}}</span></td>
            <td style="color:#42464e;">{{r.x}}</td>
          </tr>
        </sc-for>
      </tbody>
    </table>
  </section>
</div>
