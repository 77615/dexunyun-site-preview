<style>
body{margin:0;background:#f5f7fb}
.kc-map{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;color:#1d2129}
.kc-map *{box-sizing:border-box}
.kc-mt{width:100%;border-collapse:collapse;font-size:13px}
.kc-mt th{background:#f7f8fa;color:#4e5969;font-weight:600;text-align:left;height:38px;padding:0 14px;white-space:nowrap}
.kc-mt td{height:31px;padding:0 14px;border-top:1px solid #f0f2f5}
.kc-mt td.g{color:#6b7785;font-size:12px}
.kc-mt td.n{color:#165dff;font-weight:600}
.kc-pill{display:inline-flex;height:22px;align-items:center;padding:0 8px;border-radius:4px;font-size:12px;border:1px solid}
.kc-pill.keep{background:#e8f9f0;border-color:#b9ebd0;color:#00754e}
.kc-pill.tab{background:#eaf2ff;border-color:#b5d0ff;color:#165dff}
.kc-pill.ren{background:#fff4e8;border-color:#ffd9a3;color:#a84700}
.kc-pill.ask{background:#f6f9ff;border-color:#b5d0ff;color:#0e4edb}
.kc-tree-g{font-size:12px;color:#6b7785;margin:14px 0 6px}
.kc-tree-i{height:34px;display:flex;align-items:center;padding:0 10px;border-radius:4px;color:#4e5969}
.kc-tree-i span{margin-left:auto;font-size:12px;color:#6b7785}

/* v2: 德迅安全卫士 8081 / Figma 组件样式 */
.kc{background:#f7f8fa;font-family:"PingFang SC","Helvetica Neue",Helvetica,"Microsoft YaHei",Arial,sans-serif;color:#1d2129}
.kc-top{height:56px;padding:0 24px 0 0;border-bottom:1px solid #e5e6eb;gap:16px}
.kc-logo{width:220px;height:56px;padding:0 20px;border-right:1px solid #e5e6eb;font-size:16px;font-weight:600;flex-shrink:0}
.kc-mark{width:28px;height:28px;border-radius:6px;font-size:13px}
.kc-prod{height:32px;border-radius:2px;border-color:#e5e6eb;color:#4e5969}
.kc-crumb{display:flex;align-items:center;gap:6px;font-size:14px;color:#86909c;white-space:nowrap;overflow:hidden;min-width:0}
.kc-crumb i{font-style:normal;color:#c9cdd4}
.kc-crumb b{font-weight:400;color:#1d2129}
.kc-search{height:32px;border:0;border-radius:2px;background:#f2f3f5;margin-left:auto;flex:0 1 300px}
.kc-tl{margin-left:0;gap:18px;font-size:14px}
.kc-user{display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}
.kc-user b{font-size:13px;font-weight:600;color:#1d2129}
.kc-user small{font-size:11px;color:#86909c}
.kc-av{width:32px;height:32px}
.kc-side{flex-basis:220px;border-right:1px solid #e5e6eb;padding:12px}
.kc-sh{padding:8px 12px 14px;border-color:#f2f3f5}
.kc-gl{font-size:12px;color:#86909c;padding:14px 12px 6px}
.kc-it{height:40px;padding:0 12px;border-radius:6px;color:#4e5969}
.kc-it:hover{background:#f2f3f5}
.kc-it.on{background:#e8f3ff;color:#165dff;font-weight:500}
.kc-main{padding:0 0 32px}
.kc-main > *:not(.kc-hd){margin-left:24px;margin-right:24px}
.kc-hd{background:#fff;border-bottom:1px solid #e5e6eb;padding:16px 24px;margin:0 0 16px;align-items:center}
.kc-hdl{display:flex;align-items:center;gap:12px}
.kc-ico{width:40px;height:40px;border-radius:6px;background:#e8f3ff;color:#165dff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kc-eb{display:none}
.kc-h1{font-size:16px;font-weight:600;color:#1d2129;margin:0 0 4px}
.kc-desc{font-size:12px;color:#86909c}
.kc-btn{height:32px;border-radius:2px;border-color:#e5e6eb;padding:0 15px;color:#4e5969}
.kc-btn.pri{box-shadow:none;background:#165dff;color:#fff}
.kc-btn.sm{height:28px;padding:0 12px}
.kc-card{border-color:#e5e6eb;border-radius:4px;box-shadow:0 2px 4px rgba(0,0,0,.02),0 1px 6px -1px rgba(0,0,0,.02),0 1px 2px rgba(0,0,0,.03)}
.kc-kpi span{font-size:12px;color:#86909c}
.kc-kpi b{font-size:24px;font-weight:700}
.kc-tabs{gap:32px;padding:0 16px}
.kc-tab{height:52px}
.kc-tab.on{font-weight:500}
.kc-in{height:32px;border:0;border-radius:2px;background:#f2f3f5}
.kc-bar{padding:12px 16px}
.kc-t{font-size:14px}
.kc-t th{background:#f2f3f5;color:#1d2129;font-weight:500;height:44px}
.kc-t th + th{box-shadow:inset 1px 0 0 #e5e6eb}
.kc-t td{height:46px;border-top:1px solid #e5e6eb;color:#1d2129}
.kc-t td a + a{margin-left:8px !important;padding-left:8px;border-left:1px solid #e5e6eb}
.kc-tag{height:22px;border-radius:2px}
.kc-foot{padding:14px 16px;border-top:1px solid #e5e6eb;align-items:center;font-size:14px;color:#4e5969}
.kc-pg{display:flex;align-items:center;gap:8px;font-size:14px;color:#4e5969}
.kc-pg button{min-width:28px;height:28px;border:1px solid #e5e6eb;border-radius:2px;background:#fff;font:inherit;font-size:14px;color:#1d2129;padding:0 6px;cursor:pointer}
.kc-pg button.on{border-color:#165dff;color:#165dff}
.kc-pg input{width:48px;height:28px;border:1px solid #e5e6eb;border-radius:2px;font:inherit}
.kc-note,.kc-alert{border-radius:2px}
.kc-sw{width:36px;height:20px}
.kc-sw::after{width:14px;height:14px}
.kc-sw.on::after{left:19px}
.kc-opt{border-radius:4px}
.kc-seg{border-radius:2px}
.kc-res-i,.kc-scn{border-radius:4px}
.kc-panel{border-radius:0 0 4px 4px}

.kc-dd{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 12px;border:1px solid transparent;border-radius:2px;background:#f2f3f5;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.kc-dd span{color:#86909c}
.kc-dd b{font-weight:400;color:#1d2129}
.kc-dd svg{color:#86909c;margin-left:4px}
.kc-dd:hover{background:#e5e6eb}
.kc-dd:focus-visible,.kc-dd[aria-expanded="true"]{background:#fff;border-color:#165dff;outline:0}

























/* side54：侧栏统一 */
.kc-side{flex:0 0 220px;display:flex;flex-direction:column;padding:12px 10px 0;border-right:1px solid #e5e9f0;background:radial-gradient(70% 16% at 90% 70%,rgba(186,215,246,.75),rgba(186,215,246,0) 70%),radial-gradient(80% 18% at 10% 74%,rgba(210,232,250,.7),rgba(210,232,250,0) 70%),linear-gradient(180deg,#fbfcfe 0%,#f5f7fb 42%,#edf3fb 72%,#f2f5fa 100%)}
.kc-side .kc-sh{padding:6px 10px 14px;margin:0 0 4px;border-bottom:1px solid rgba(229,233,240,.9)}
.kc-side .kc-gl{display:flex;align-items:center;gap:6px;padding:16px 8px 6px;font-size:12px;color:#86909c;font-weight:400}
.kc-side .kc-gl svg{flex:0 0 auto;color:#86909c}
.kc-side .kc-gl + .kc-it{margin-top:2px}
.kc-side .kc-it{position:relative;display:flex;align-items:center;gap:10px;height:40px;margin:2px 0;padding:0 10px;border-radius:6px;font-size:14px;color:#1d2129;font-weight:400;text-decoration:none;background:transparent}
.kc-side .kc-it:hover{background:rgba(255,255,255,.75)}
.kc-side .kc-it.on{background:#e1ecfd;color:#165dff;font-weight:500}
.kc-side .kc-it.on::after,.kc-side .kc-ki.on::after{content:"";position:absolute;right:-11px;top:6px;bottom:6px;width:3px;border-radius:2px;background:#165dff}
.kc-side .kc-it.cur{color:#165dff;font-weight:500}
.kc-side .kc-it span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc-side .kc-it em,.kc-side .kc-ki em{margin-left:auto;font-style:normal;font-size:12px;color:#86909c}
.kc-ic{flex:0 0 18px;width:18px;height:18px;background:#6b7785;-webkit-mask:var(--m) center/18px 18px no-repeat;mask:var(--m) center/18px 18px no-repeat}
.kc-it.on .kc-ic,.kc-it.cur .kc-ic{background:#165dff}
.kc-chev{flex:0 0 12px;width:12px;height:12px;margin-left:auto;background:#86909c;-webkit-mask:var(--chev) center/12px no-repeat;mask:var(--chev) center/12px no-repeat;transition:transform .15s}
.kc-chev.up{transform:rotate(90deg)}
.kc-it em + .kc-chev{margin-left:6px}
.kc-sub2{position:relative;margin:2px 0 6px 19px;padding-left:12px;border-left:1px solid #dfe5ee}
.kc-ki{position:relative;display:flex;align-items:center;height:36px;margin:2px 0;padding:0 12px;border-radius:6px;font-size:14px;color:#4e5969;text-decoration:none}
.kc-ki:hover{background:rgba(255,255,255,.75);color:#1d2129}
.kc-ki.on{background:#e1ecfd;color:#165dff;font-weight:500}
.kc-ki.on::after{right:-11px}
.kc-sf{margin:auto -10px 0;padding:10px 10px 14px;border-top:1px solid rgba(229,233,240,.9);background:rgba(255,255,255,.45)}
.kc-sf .kc-it{color:#4e5969}

.kc-fl{flex:1;position:relative;height:60px;margin:0 16px 22px}
.kc-fl::before,.kc-fl::after{content:"";position:absolute;left:0;right:0;border-top:1.5px dashed #165dff}

.kc-fl .b{top:44px}
.kc-fl .b::before{background:#14c9c9}

.kc-fk:first-child{border-left:0}
.kc-fk:hover{background:#f7f8fa}
.kc-fk span{font-size:13px;color:#4e5969}
.kc-fk b{display:block;margin-top:4px;font-size:22px;font-weight:600}
.kc-fk b small{font-size:12px;font-weight:400;color:#86909c;margin-left:4px}
.kc-mtabs{margin:0 !important;align-items:center;padding-right:20px}
.kc-mtabs .kc-sg button{height:26px !important;padding:0 12px !important;border-bottom:0 !important;font-size:13px}
.kc-mtabs .kc-sg button.on{color:#165dff;background:#fff}
.kc-top5 li a{color:#1d2129;text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc-top5 li a:hover{color:#165dff;text-decoration:underline}
.kc-hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:center;gap:24px;padding:32px 36px;margin-bottom:16px;background:linear-gradient(110deg,#fff 40%,#eef5ff 100%)}
.kc-hero h2{margin:0 0 10px;font-size:24px;font-weight:600}

.kc-st4 span{font-size:13px;color:#4e5969;line-height:1.6}

.kc-alines span.bad{border-color:#f53f3f}

.kc-tag.ok,.kc-tag.warn,.kc-tag.err,.kc-tag.info,.kc-tag.mut{gap:5px;padding:0 8px 0 7px}

.kc-ch{padding:15px 24px}
.kc-ch h2{font-size:15px;font-weight:600;color:#1d2129;display:flex;align-items:center;gap:8px}

.fi-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.fi-pill.ok{background:#e8ffea;border-color:#aff0b5;color:#00754e}
.ac-kv div{padding:12px 0}
.kc-t thead th{background:#f7f8fa;color:#4e5969;font-weight:500}
.ac-set li{padding:18px 24px}
.ac-set li > i{width:40px;height:40px;border-radius:6px;background:linear-gradient(180deg,#f2f6ff 0%,#e8f0ff 100%)}

.ac-set li p{margin-top:6px;color:#4e5969}
.ac-set li .kc-btn{min-width:88px;justify-content:center;height:32px}

/* motion68：页面与交互过渡 */
@view-transition{navigation:auto}
.kc-top{view-transition-name:kc-top}
.kc-side{view-transition-name:kc-side}
.kc-main{view-transition-name:kc-main}
::view-transition-group(kc-top),::view-transition-group(kc-side){animation:none}
::view-transition-old(kc-main){animation:mo-fade-out .12s ease-in both}
::view-transition-new(kc-main){animation:mo-fade-in .2s ease-out both}
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}
@keyframes mo-fade-in{from{opacity:0}}
@keyframes mo-fade-out{to{opacity:0}}
@keyframes mo-rise{from{opacity:0;transform:translateY(8px)}}
@keyframes mo-rise-s{from{opacity:0;transform:translateY(4px)}}
@keyframes mo-drop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
@keyframes mo-pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
@keyframes mo-slide{from{transform:translateX(100%)}}
@keyframes mo-open{from{opacity:0;transform:translateY(-4px)}}
.kc-main > *{animation:mo-rise .24s cubic-bezier(.2,.8,.2,1) both}
.kc-main > :nth-child(2){animation-delay:.04s}
.kc-main > :nth-child(3){animation-delay:.08s}
.kc-main > :nth-child(4){animation-delay:.12s}
.kc-main > :nth-child(n+5){animation-delay:.16s}
.kc-card > .kc-tw,.kc-card > .kc-cb,.kc-card > .kc-bar,.kc-card > .ac-chips,.kc-card > .nt-list,.sv-charts,.sv-bar,.sv-prog,.fl-ok{animation:mo-rise-s .2s cubic-bezier(.2,.8,.2,1) both}
.ac-al{animation:mo-rise-s .2s cubic-bezier(.2,.8,.2,1) both}
.ac-pop{animation:mo-drop .16s cubic-bezier(.2,.8,.2,1) both;transform-origin:top right}
.ac-mask{animation:mo-fade-in .12s ease-out both}
.vf-mask{animation:mo-fade-in .18s ease-out both}
.vf-dlg{animation:mo-pop .22s cubic-bezier(.2,.8,.2,1) both}
.ac-drw{animation:mo-slide .28s cubic-bezier(.2,.8,.2,1) both}
.kc-sub2{animation:mo-open .2s cubic-bezier(.2,.8,.2,1) both}
.kc-chev{transition:transform .2s cubic-bezier(.2,.8,.2,1) !important}
.kc-btn,.kc-it,.kc-ki,.kc-tab,.kc-dtabs button,.ac-chips button,.sv-seg button,.sv-os button,.sv-rng button,.fl-radio button,.ac-st,.sv-task,.kc-tag,.ac-cbx{transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,transform .1s}
.kc-btn:active{transform:scale(.98)}
.ac-bar i{transition:width .6s cubic-bezier(.2,.8,.2,1)}
.fm-new{animation:mo-new 1.6s ease-out both}
@keyframes mo-new{from{background:#e8ffea}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none !important}}
